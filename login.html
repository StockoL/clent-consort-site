      content="https://stockol.github.io/clent-consort-project-ms1/"

      property="twitter:description"

    <!-- ASSET OPTIMISATION: Standardised pre-loading of branding and typographic assets to ensure a zero-latency transition from the public site to the secure portal. -->
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/favicon-clent.png" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <!-- Body with ID for back-to-top anchor link -->
  <body id="top">
    <header class="site-header">
      <div class="l-center header-inner">
        <!-- Logo anchor -->
        <a href="index.html" class="logo-link">
          <img
            src="assets/images/clent-consort-logo.webp"
            alt="Logo"
            width="50"
            height="50"
          />
          <span class="brand-name">The Clent Consort</span>
        </a>
        <!-- Main Navigation -->
        <nav class="main-nav" aria-label="Main Navigation">
          <button
            class="menu-toggle"
            aria-expanded="false"
            aria-controls="nav-list"
          >
            <span class="sr-only">Menu</span>
            <div class="hamburger" aria-hidden="true"></div>
          </button>

          <ul id="nav-list" class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="l-center">
      <div class="login-wrapper l-stack l-stack--large">
        <!-- USER FLOW: Dedicated .login-nav with a .back-link utility. This provides a clear 'escape hatch' back to the public domain, preventing user frustration during authentication. -->
        <nav class="login-nav">
          <a href="index.html" class="back-link">
            <span aria-hidden="true">&larr;</span> Back to Public Site
          </a>
        </nav>
        <!-- Member Login Form -->
        <!-- AUTHENTICATION UI: Combines .box.invert with .l-stack primitives. This creates a focused, high-contrast environment that minimises peripheral distractions during the login process. -->
        <section class="box invert l-stack">
          <div class="l-stack l-stack--small login-header">
            <h1>Member Login</h1>
            <p>Access to rehearsal scores, schedules, and recordings.</p>
          </div>

          <form action="members.html" method="GET" class="l-stack">
            <!-- PROTOTYPE LOGIC: Using GET method for client-side navigation within this static demonstration. -->
            <div class="form-group l-stack l-stack--small">
              <label for="user">Username</label>
              <input
                type="text"
                id="user"
                name="username"
                placeholder="e.g. Bass1"
                required
                autocomplete="username"
              />
            </div>
            <!-- DEFENSIVE UX: Implements pattern-matching on the password field to provide immediate client-side validation. Uses aria-describedby to link the input with its pedagogical 'hint' for screen-reader parity. -->
            <div class="form-group l-stack l-stack--small">
              <label for="pass">Skeleton Key</label>
              <input
                type="password"
                id="pass"
                name="password"
                pattern="Clent2026"
                placeholder="••••••••"
                required
                autocomplete="current-password"
                aria-describedby="pass-hint"
              />
              <p id="pass-hint" class="form-hint">
                <strong>Hint:</strong> The name of the choir + the current year.
              </p>
            </div>
            <!-- INCLUSIVE DESIGN: Form inputs are styled with minimum height requirements (min-height: 3.5rem) to ensure "Fat-Finger" compatibility on mobile devices and meet WCAG touch-target guidelines. -->
            <button type="submit" class="cta-button">
              Enter Resource Area
            </button>
          </form>

          <p class="login-footer-text">
            Forgot the key? Contact the Secretary.
          </p>
        </section>
      </div>
    </main>
    <!-- GLOBAL FOOTER: Features a 3-column .footer-grid with mobile-first stacking logic and a #top skip-link for keyboard efficiency. -->

          <div class="footer-col-left">

          </div>

          <div class="footer-col-center">
            <div class="social-group">
