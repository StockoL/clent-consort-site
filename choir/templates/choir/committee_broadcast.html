{% extends 'choir/base.html' %}
{% block content %}
<div class="wrapper flow section-padding">
  <div class="text-center">
    <h1 class="text-primary">Committee Broadcast</h1>
    <p>Send announcements to all committee members.</p>

    <a href="{% url 'committee_hub' %}" class="button btn-small" data-variant="outline" style="text-decoration: none; display: inline-block; margin-block-start: var(--s-1);">
      ← Back to Hub
    </a>
  </div>

  <section class="card" data-variant="invert">
    <h2>Send Choir Broadcast</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button" data-variant="primary">Send Email</button>
    </form>
  </section>
</div>
{% endblock %}
