{% extends 'choir/base.html' %}
{% block content %}
<a href="{% url 'committee_hub' %}" class="cta-button-outline btn-small mt-s-1" style="text-decoration: none; display: inline-block;">
      ← Back to Hub
    </a>
<div class="l-center section-padding">
  <section class="box invert">
    <h1>Send Choir Broadcast</h1>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="cta-button">Send Email</button>
    </form>
  </section>
</div>
{% endblock %}
